[project]
name = "cinema-reservation"
version = "0.1.0"
description = "Cinema Ticket Reservation - TP Processus Unifié / Agile"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "asyncpg>=0.29",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
    "pytest-cov>=4.1",
    "ruff>=0.2",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-asyncio", "httpx", "pytest-cov"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "S101", "B008", "B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError"]